name: Build PS3 Dear ImGui PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ps3:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ps3dev/ps3dev:master

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Standalone Example & PKG
        run: |
          export PS3DEV=/opt/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          cd examples/example_ps3
          make all pkg || make all

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps3-imgui-package
          path: |
            examples/example_ps3/*.pkg
            examples/example_ps3/*.self
            examples/example_ps3/EBOOT.BIN
            examples/example_ps3/*.elf
          if-no-files-found: ignore
