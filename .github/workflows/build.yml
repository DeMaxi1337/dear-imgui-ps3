name: Build PS3 Dear ImGui PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ps3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies & PS3 Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison flex autoconf automake texinfo libncurses5-dev gcc g++ make wget git libelf-dev libtool \
            python3 python3-pip
          echo "Downloading official prebuilt PS3 toolchain..."
          wget -q https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-07-26/ps3dev-linux-X64.tar.gz -O /tmp/ps3dev.tar.gz
          sudo mkdir -p /opt
          sudo tar -xzf /tmp/ps3dev.tar.gz -C /opt
          sudo rm -f /tmp/ps3dev.tar.gz

      - name: Build Standalone Example & PKG
        run: |
          export PS3DEV=/opt/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH
          cd examples/example_ps3
          make all

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps3-imgui-package
          path: |
            examples/example_ps3/*.pkg
            examples/example_ps3/*.self
            examples/example_ps3/EBOOT.BIN
            examples/example_ps3/*.elf
          if-no-files-found: warn
